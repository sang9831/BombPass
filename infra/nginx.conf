# 운영용 Nginx 샘플. 백엔드가 서로 다른 호스트에 배포되면 주소를 교체하세요.
upstream bombpass_backend {
    server backend-a:8080;
    server backend-b:8080;
}
server {
    listen 80;
    location /api/ { proxy_pass http://bombpass_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /ws { proxy_pass http://bombpass_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
}
